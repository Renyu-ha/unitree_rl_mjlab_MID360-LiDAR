[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree-rl-mjlab"
version = "0.0.2"
description = "Unitree Go2W and G1 MID360 perceptive locomotion tasks"
license = "Apache-2.0"
license-files = ["LICENCE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "mjlab @ git+https://github.com/mujocolab/mjlab.git@8bb2bc9e187797689ec82c78c35019afd2fd0376",
  # Keep the validated core versions in standard metadata so plain pip
  # installs them without a constraints file or additional package indexes.
  "mujoco==3.16.0",
  # 3.16.0.post1: upstream EPA fixes #1771/#1796 and fixed horizon 64.
  "mujoco-warp @ git+https://github.com/Renyu-ha/mujoco_warp.git@6dea56edf221906310a90896e3ad913ad12459c3",
  "warp-lang==1.18.0",
  "rsl-rl-lib==5.5.1",
  "torch==2.14.1",
  "scipy>=1.15",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
src = ["assets/robots/**/*.xml", "assets/robots/**/*.STL", "assets/robots/**/*.stl", "assets/robots/**/*.obj", "assets/robots/**/LICENSE", "assets/robots/**/LICENCE", "assets/robots/**/SOURCE.md"]
